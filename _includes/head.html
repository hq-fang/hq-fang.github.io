{% include base_path %}

<meta charset="utf-8">

<script>
  /* Runs before first paint: apply the visitor's saved theme (set with the toggle) so
     dark-mode visitors never see a flash of the light theme, however slow the network is. */
  (function (root) {
    var theme;
    try { theme = localStorage.getItem("theme"); } catch (e) {}
    if (theme === "dark") { root.setAttribute("data-theme", "dark"); }
    else if (theme === "light") { root.removeAttribute("data-theme"); }
    root.className = root.className.replace(/\bno-js\b/g, "") + " js";

    /* Expand / collapse buttons for lists that CSS collapses from first paint (the news list).
       Handled here, not in site.js, so the button works even before / without that script. */
    document.addEventListener("click", function (event) {
      var toggle = event.target.closest && event.target.closest("[data-list-toggle]");
      var list = toggle && document.getElementById(toggle.getAttribute("aria-controls"));
      if (!list) { return; }
      var collapsed = list.classList.toggle("is-collapsed");
      toggle.setAttribute("aria-expanded", String(!collapsed));
      toggle.setAttribute("aria-label", list.getAttribute(collapsed ? "data-expand-label" : "data-collapse-label") || "");
    });
  })(document.documentElement);
</script>

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

{% comment %}
  `?v=` busts browser caches on every deploy (GitHub Pages caches assets for 10 minutes,
  which otherwise lets fresh HTML render with stale CSS/JS right after a push).
{% endcomment %}
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ site.time | date: '%s' }}">
